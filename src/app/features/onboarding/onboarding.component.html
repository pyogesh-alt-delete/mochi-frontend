<div class="onboard-wrap">
  <div class="dot-grid"></div>
  <div class="orb"></div>

  <div class="onboard-container">
    <div class="onboard-header">
      <div class="logo-row">
        <div class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="white" opacity=".9"/></svg>
        </div>
        <span class="logo-text">mochi</span>
      </div>
      <div class="step-badge">Step 01</div>
    </div>

    <div class="onboard-body">
      <div class="onboard-left">
        <h1>Add your first wallet</h1>
        <p class="subtitle">Connect a bank account, card, or cash wallet to get started.</p>

        <div class="field-group">
          <label>Wallet Type</label>
          <div class="type-grid">
            @for (type of walletTypes; track type) {
              <button class="type-btn" [class.active]="walletType() === type" (click)="walletType.set(type)">
                {{ type }}
              </button>
            }
          </div>
        </div>

        <div class="field-group">
          <label>Wallet Name</label>
          <input type="text" [ngModel]="walletName()" (ngModelChange)="walletName.set($event)" placeholder="e.g. HDFC Bank">
        </div>

        <div class="field-group">
          <label>Current Balance (₹)</label>
          <input type="number" [ngModel]="balance()" (ngModelChange)="balance.set(+$event)" placeholder="0">
        </div>

        <div class="field-group">
          <label>Card Color</label>
          <div class="gradient-picker">
            @for (g of gradients; track g) {
              <button class="grad-dot" [style.background]="g" [class.active]="selectedGradient() === g" (click)="selectedGradient.set(g)"></button>
            }
          </div>
        </div>

        <div class="onboard-actions">
          <button class="btn-primary" (click)="create()">Create Wallet &amp; Continue</button>
          <button class="btn-ghost" (click)="skip()">Skip for now</button>
        </div>
      </div>

      <div class="onboard-right">
        <div class="preview-label">Live Preview</div>
        <div class="preview-card" [style.background]="selectedGradient()">
          <div class="card-sheen"></div>
          <div class="card-top">
            <span class="card-chip">
              <svg width="28" height="22" viewBox="0 0 28 22"><rect x="1" y="1" width="26" height="20" rx="4" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/><line x1="1" y1="8" x2="27" y2="8" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><line x1="14" y1="1" x2="14" y2="21" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/></svg>
            </span>
            <span class="card-type-label">{{ walletType() }}</span>
          </div>
          <div class="card-balance mono">{{ fmt(cardBalance()) }}</div>
          <div class="card-bot">
            <span class="card-name-label">{{ cardName() }}</span>
            <span class="card-brand mono">MOCHI</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
